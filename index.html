<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "DM Sans", Arial, sans-serif;
            background: #fbfaf7;
            color: #292929;
            line-height: 1.6;
            overflow-x: hidden;
        }

        img {
            max-width: 100%;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
        }

        h1,
        h2,
        h3 {
            font-family: "Playfair Display", Georgia, serif;
        }


        /* =========================
           COLORS
        ========================= */

        :root {
            --gold: #c9a04d;
            --gold-dark: #a98238;
            --cream: #fbfaf7;
            --white: #ffffff;
            --black: #171717;
            --gray: #666;
            --light-gray: #eeeeeb;
        }


        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            background: var(--black);
            color: white;
            text-align: center;
            padding: 9px 15px;
            font-size: 0.78rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(0,0,0,0.06);

            padding: 16px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-container img {
            width: 58px;
            height: 58px;
            object-fit: contain;
        }

        .logo-text {
            display: block;

            font-family: "Playfair Display", Georgia, serif;

            font-size: 1.5rem;
            font-weight: 700;

            color: var(--gold);

            letter-spacing: 3px;
        }

        .logo-tagline {
            display: block;

            color: #777;

            font-size: 0.62rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        nav ul {
            list-style: none;

            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav a {
            font-size: 0.9rem;
            font-weight: 600;

            transition: 0.3s;
        }

        nav a:hover {
            color: var(--gold);
        }

        .nav-order {
            background: var(--black);
            color: white;

            padding: 10px 18px;
            border-radius: 30px;

            transition: 0.3s;
        }

        .nav-order:hover {
            background: var(--gold);
            color: white;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 650px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 100px 20px;

            color: white;

            position: relative;

            background:
                linear-gradient(
                    rgba(15,15,15,0.55),
                    rgba(15,15,15,0.65)
                ),
                url("https://images.unsplash.com/photo-1563241527-3004b7be0ff3?auto=format&fit=crop&q=90&w=2000");

            background-size: cover;
            background-position: center;
        }

        .hero-content {
            max-width: 850px;
        }

        .hero-small {
            color: #e8c875;

            text-transform: uppercase;
            letter-spacing: 4px;

            font-size: 0.8rem;
            font-weight: 700;

            margin-bottom: 18px;
        }

        .hero h1 {
            color: white;

            font-size: clamp(3rem, 7vw, 5.8rem);

            line-height: 1.05;

            margin-bottom: 25px;
        }

        .hero h1 span {
            color: #e5c46c;
        }

        .hero p {
            max-width: 650px;

            margin: 0 auto 35px;

            color: #eee;

            font-size: 1.1rem;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            padding: 15px 30px;

            border-radius: 40px;

            font-weight: 700;

            transition: 0.3s;

            border: 1px solid var(--gold);
        }

        .btn-primary {
            background: var(--gold);
            color: white;
        }

        .btn-primary:hover {
            background: var(--gold-dark);
            transform: translateY(-3px);
        }

        .btn-outline {
            background: transparent;
            color: white;
            border-color: white;
        }

        .btn-outline:hover {
            background: white;
            color: var(--black);
        }


        /* =========================
           INTRO
        ========================= */

        .intro {
            text-align: center;

            max-width: 850px;

            margin: auto;

            padding: 90px 20px 50px;
        }

        .eyebrow {
            color: var(--gold);

            text-transform: uppercase;

            font-size: 0.75rem;
            font-weight: 700;

            letter-spacing: 3px;

            margin-bottom: 12px;
        }

        .intro h2 {
            font-size: clamp(2rem, 4vw, 3.2rem);

            margin-bottom: 18px;
        }

        .intro p {
            color: var(--gray);
            font-size: 1.05rem;
        }


        /* =========================
           PRODUCTS
        ========================= */

        .container {
            max-width: 1250px;

            margin: auto;

            padding: 50px 20px 100px;
        }

        .product-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 28px;
        }

        .product-card {
            background: white;

            border-radius: 18px;

            overflow: hidden;

            border: 1px solid #eee;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.05);

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }

        .product-card:hover {
            transform: translateY(-8px);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.12);
        }

        .product-image-wrap {
            position: relative;
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 360px;

            object-fit: cover;

            display: block;

            transition: transform 0.6s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .badge {
            position: absolute;

            top: 15px;
            left: 15px;

            background: white;

            color: var(--black);

            padding: 7px 13px;

            border-radius: 30px;

            font-size: 0.7rem;
            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .product-info {
            padding: 26px;
        }

        .product-info h3 {
            font-size: 1.45rem;
            margin-bottom: 9px;
        }

        .product-info p {
            color: #666;

            font-size: 0.92rem;

            margin-bottom: 15px;
        }

        .price-tag {
            display: block;

            color: var(--gold);

            font-size: 1.2rem;

            font-weight: 700;

            margin-bottom: 12px;
        }

        .note {
            color: #888 !important;

            font-size: 0.78rem !important;
        }

        .card-btn {
            display: block;

            text-align: center;

            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #f4f2ed;

            font-weight: 700;

            transition: 0.3s;
        }

        .card-btn:hover {
            background: var(--gold);
            color: white;
        }


        /* =========================
           CUSTOM SECTION
        ========================= */

        .custom-section {
            background: var(--black);

            color: white;

            padding: 100px 7%;

            position: relative;

            overflow: hidden;
        }

        .custom-section::before {
            content: "✿";

            position: absolute;

            font-size: 300px;

            right: -40px;
            bottom: -120px;

            color: rgba(255,255,255,0.03);
        }

        .custom-inner {
            max-width: 1150px;

            margin: auto;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 70px;

            align-items: center;
        }

        .custom-image {
            width: 100%;

            max-height: 550px;

            object-fit: cover;

            border-radius: 18px;
        }

        .custom-section h2 {
            color: white;

            font-size: clamp(2.2rem, 5vw, 3.8rem);

            margin-bottom: 20px;
        }

        .custom-section p {
            color: #ccc;

            margin-bottom: 18px;
        }

        .custom-price {
            color: #e4c66c !important;

            font-size: 1.15rem;

            font-weight: 700;
        }


        /* =========================
           WHY SOL FLOR
        ========================= */

        .why-section {
            padding: 100px 20px;

            text-align: center;
        }
